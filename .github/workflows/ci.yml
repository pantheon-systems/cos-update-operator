name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  GO_VERSION: '1.23'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          curl -L https://github.com/protocolbuffers/protobuf/releases/download/v3.11.4/protoc-3.11.4-linux-x86_64.zip -o ~/protoc.zip
          unzip ~/protoc.zip -d ~/
          sudo cp ~/bin/protoc /usr/local/bin/
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Configure Git
        run: |
          git config --global user.email ci@github.com
          git config --global user.name ci

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62

      - name: Run make master-sha
        run: make master-sha

      - name: Run tests
        run: make test

  release:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          curl -L https://github.com/protocolbuffers/protobuf/releases/download/v3.11.4/protoc-3.11.4-linux-x86_64.zip -o ~/protoc.zip
          unzip ~/protoc.zip -d ~/
          sudo cp ~/bin/protoc /usr/local/bin/
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Configure Git
        run: |
          git config --global user.email ci@github.com
          git config --global user.name ci

      - name: Run make master-sha
        run: make master-sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Artifact Registry
        id: auth-gar
        uses: pantheon-systems/common-gh/auth-gar@69fc6202e78cfdde37fb17b8818fa13afcef53c1 # main 2025-12-08T12:11:35Z

      - name: Build and push images
        env:
          OPERATOR_IMAGE_REPO: us-docker.pkg.dev/pantheon-artifacts/internal/cos-update-operator
          AGENT_IMAGE_REPO: us-docker.pkg.dev/pantheon-artifacts/internal/cos-update-operator-agent
        run: make push
