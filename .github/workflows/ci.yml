name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  GO_VERSION: '1.25.3'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          curl -L https://github.com/protocolbuffers/protobuf/releases/download/v3.11.4/protoc-3.11.4-linux-x86_64.zip -o ~/protoc.zip
          unzip ~/protoc.zip -d ~/
          sudo cp ~/bin/protoc /usr/local/bin/
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Configure Git
        run: |
          git config --global user.email ci@github.com
          git config --global user.name ci

      - name: Run make master-sha
        run: make master-sha

      - name: Generate protobuf files
        run: make proto

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: v1.62
          skip-cache: true
          args: --timeout=5m

      - name: Run tests
        run: make test

  release:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    #if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          curl -L https://github.com/protocolbuffers/protobuf/releases/download/v3.11.4/protoc-3.11.4-linux-x86_64.zip -o ~/protoc.zip
          unzip ~/protoc.zip -d ~/
          sudo cp ~/bin/protoc /usr/local/bin/
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Configure Git
        run: |
          git config --global user.email ci@github.com
          git config --global user.name ci

      - name: Run make master-sha
        run: make master-sha

      - name: Generate protobuf files
        run: make proto

      - name: Show version
        run: |
          VERSION=$(git rev-parse --short=7 HEAD)-$(date -u +%H%M)
          echo "Building version: $VERSION"
          echo "Images will be tagged as:"
          echo "  - ghcr.io/pantheon-systems/cos-update-operator:$VERSION"
          echo "  - ghcr.io/pantheon-systems/cos-update-operator-agent:$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          OPERATOR_IMAGE_REPO: ghcr.io/pantheon-systems/cos-update-operator
          AGENT_IMAGE_REPO: ghcr.io/pantheon-systems/cos-update-operator-agent
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: make push
