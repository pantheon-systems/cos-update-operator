# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/cos-update-operator.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
